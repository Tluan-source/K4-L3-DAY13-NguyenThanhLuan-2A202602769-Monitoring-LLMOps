service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: >
    SLO fast_successful_requests: 99.5% request trong cửa sổ 28 ngày phải vừa
    thành công vừa có latency_ms <= 3000, đo trên event response_sent.
    SLI = good_event / total_event, với total = request_received.
    Error budget = 100% - 99.5% = 0.5%.
    Baseline buổi lab (FakeLLM + load test + prompt versioning): đa số request
    150–1500ms, TTFT ~50ms; có request vượt 3000ms khi retrieval chậm
    (quan sát ~3319ms). Ngưỡng 3000ms giữ nguyên vì khớp dashboard latency P95
    và vẫn chứa được practice rag_slow (~2500ms), đồng thời bắt incident chậm hơn.
    Ví dụ 10.000 request / 28 ngày: tối đa 50 request được phép fail hoặc chậm
    hơn 3000ms. Với ~40 request trong buổi lab, 0.5% ≈ 0.2 request — một request
    3319ms đã đốt budget; vì vậy alert P95 bật sớm hơn cửa sổ SLO 28 ngày.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
